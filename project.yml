name: RepostSweep
options:
  bundleIdPrefix: app.repostsweep
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
fileGroups:
  - RepostSweep.storekit
targets:
  RepostSweep:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: RepostSweep
        excludes:
          - Info.plist
          - Resources/TikTokBridge.js
          - PrivacyInfo.xcprivacy
      - path: RepostSweep/Resources/TikTokBridge.js
        buildPhase: resources
      - path: RepostSweep/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.repostsweep.ios
        PRODUCT_NAME: RepostSweep
        INFOPLIST_FILE: RepostSweep/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG DEBUG_UI
    scheme:
      storeKitConfiguration: RepostSweep.storekit
